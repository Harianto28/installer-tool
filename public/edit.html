<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Edit Script - NSIS Installer Generator</title>
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="edit-page">
    <div class="container">
              <div class="header">
          <h1>✏️ Edit & Clone Script</h1>
          <p>Modify the script and create a new installer with the same files</p>
        </div>

      <div class="content">
        <div class="back-link">
          <a href="index.html" class="btn-secondary">← Back to Home</a>
        </div>

        <div id="loading" class="loading">
          <p>Loading script...</p>
        </div>

        <div id="edit-form" style="display: none;">
                      <form id="form">
              <div class="form-group">
                <label for="title">Installer Title</label>
                <input type="text" id="title" class="form-control" required>
              </div>

              <div class="form-group">
                <label for="version">Version</label>
                <input type="text" id="version" class="form-control" value="v1.0.0" required>
              </div>

              <div class="form-group">
                <label for="installDir">Install Directory</label>
                <input type="text" id="installDir" class="form-control" value="C:\MyApp" required>
              </div>

              <div class="script-preview">
                <h3>📜 Generated NSIS Script Preview</h3>
                <p class="script-note">💡 This script updates automatically when you change the fields above! You can also edit it manually if needed.</p>
                <textarea id="script" class="form-control"></textarea>
              </div>

              <div class="sections-container">
                <h3>📦 Installer Sections</h3>
                <div id="sections-list"></div>
                <button type="button" id="add-section-btn" class="btn-secondary">
                  ➕ Add New Section
                </button>
              </div>

            <div class="form-actions">
              <button type="submit" class="generate-btn">
                🚀 Create New Installer
              </button>
              <button type="button" id="delete-btn" class="btn-danger">
                🗑️ Delete Script
              </button>
            </div>
          </form>
        </div>

        <div id="result"></div>
      </div>
    </div>
    <script src="edit.js"></script>
  </body>
</html>
